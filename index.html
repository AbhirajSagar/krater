<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StarSparrow: Multiplayer Spaceship Battle</title>
    <meta name="description" content="High-octane 3D multiplayer spaceship dogfight simulator powered by Three.js and Render backend." />
  </head>
  <body>
    <canvas id="app"></canvas>

    <!-- Minimal Glassmorphic Loading Screen Overlay -->
    <div id="loading-screen" class="loading-screen">
      <div class="glass-card">
        <div class="glass-percent" id="loading-percent">0%</div>
        <div class="glass-bar-track">
          <div class="glass-bar-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-prompt" id="loading-prompt">CLICK ANYWHERE TO START FULLSCREEN</div>
      </div>
    </div>

    <!-- Sci-Fi HUD Crosshair -->
    <div id="crosshair-container" class="crosshair-container">
      <div class="crosshair-hud">
        <div class="crosshair-dot"></div>
        <div class="crosshair-circle"></div>
        <div class="crosshair-bracket top-left"></div>
        <div class="crosshair-bracket top-right"></div>
        <div class="crosshair-bracket bottom-left"></div>
        <div class="crosshair-bracket bottom-right"></div>
        <div class="crosshair-line line-top"></div>
        <div class="crosshair-line line-bottom"></div>
        <div class="crosshair-line line-left"></div>
        <div class="crosshair-line line-right"></div>
      </div>
    </div>

    <!-- Touch controls for touch & mobile devices -->
    <div id="touch-controls">
      <!-- Left: Steering & Throttle Joystick -->
      <div id="joystick" class="touch-joystick-zone">
        <div class="joystick-base">
          <div class="joystick-knob" id="joystick-knob"></div>
        </div>
      </div>

      <!-- Right: Laser Weapon Fire Button -->
      <div id="touch-shoot-zone" class="touch-shoot-zone">
        <button id="btn-touch-shoot" class="touch-shoot-btn" aria-label="Fire Weapons" title="Tap to Fire">
          <div class="shoot-btn-core"></div>
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
