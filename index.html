<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kraters</title>
    <meta name="description" content="High-octane 3D multiplayer spaceship dogfight simulator powered by Three.js and Render backend." />
    <!-- Google Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="app"></canvas>

    <!-- Minimal Glassmorphic Loading Screen Overlay -->
    <div id="loading-screen" class="loading-screen">
      <div class="glass-card">
        <div class="loading-text" id="loading-text">Loading...</div>
        <div class="glass-bar-track">
          <div class="glass-bar-fill" id="loading-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Sci-Fi Spaceship Tactical Crosshair with Target Lock Brackets -->
    <div id="crosshair-container" class="crosshair-container" aria-hidden="true">
      <svg class="crosshair-rhombus" viewBox="0 0 44 44" fill="none">
        <!-- Central Flight Boresight Rhombus -->
        <polygon class="rhombus-outline" points="22,7 37,22 22,37 7,22" />
        <circle class="rhombus-dot" cx="22" cy="22" r="1.5" />
        <line class="rhombus-tick tick-top" x1="22" y1="2" x2="22" y2="5" />
        <line class="rhombus-tick tick-bottom" x1="22" y1="39" x2="22" y2="42" />
        <line class="rhombus-tick tick-left" x1="2" y1="22" x2="5" y2="22" />
        <line class="rhombus-tick tick-right" x1="39" y1="22" x2="42" y2="22" />
        <!-- Corner Targeting Brackets that animate and snap on lock -->
        <path class="target-bracket bracket-tl" d="M 8,15 L 8,8 L 15,8" />
        <path class="target-bracket bracket-tr" d="M 29,8 L 36,8 L 36,15" />
        <path class="target-bracket bracket-bl" d="M 8,29 L 8,36 L 15,36" />
        <path class="target-bracket bracket-br" d="M 36,29 L 36,36 L 29,36" />
      </svg>
    </div>

    <!-- Minimal Spaceship HUD: Dashed Energy Core & Slanted Healthbar -->
    <div id="minimal-ammo-hud" class="minimal-ammo-hud minimal-core-hud" aria-label="Spaceship HUD Avionics">
      <!-- Dashed Energy Core Dial -->
      <div class="energy-core-wrap">
        <svg class="energy-core-svg" viewBox="0 0 54 54">
          <defs>
            <mask id="ammo-core-mask">
              <circle id="ammo-mask-circle" class="mask-circle" cx="27" cy="27" r="22" stroke="#ffffff" stroke-width="7" fill="none" stroke-dasharray="138.23" stroke-dashoffset="0" />
            </mask>
          </defs>
          <circle class="core-ring-bg" cx="27" cy="27" r="22" />
          <circle class="core-ring-fill" cx="27" cy="27" r="22" mask="url(#ammo-core-mask)" />
        </svg>
        <span class="core-ammo-num" id="ammo-current-val">60</span>
      </div>

      <!-- Slanted Tech Healthbar -->
      <div class="core-health-track">
        <div class="core-health-fill" id="player-health-fill" style="width: 100%;"></div>
      </div>
    </div>

    <!-- Forced Landscape Orientation Guard for Smaller Mobile Touch Devices -->
    <div id="orientation-guard" class="orientation-guard hidden" aria-hidden="true">
      <div class="orientation-guard-card">
        <div class="orientation-guard-icon-wrap">
          <svg class="phone-rotate-svg" viewBox="0 0 48 48" fill="none">
            <rect class="phone-rect" x="14" y="6" width="20" height="36" rx="4" stroke="currentColor" stroke-width="2" />
            <line class="phone-speaker" x1="21" y1="10" x2="27" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle class="phone-btn" cx="24" cy="37" r="1.5" fill="currentColor" />
            <path class="rotate-arrow" d="M38 18 C 42 22, 42 28, 38 32" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
            <polygon class="rotate-head" points="36,30 40,36 34,36" fill="#00f0ff" />
          </svg>
        </div>
        <div class="orientation-guard-title">ROTATE DEVICE</div>
        <div class="orientation-guard-subtitle">LANDSCAPE MODE REQUIRED</div>
        <p class="orientation-guard-desc">
          StarSparrow requires landscape aspect-ratio for hangar telemetry and tactical dogfights.
        </p>
        <button id="btn-force-landscape" class="btn-primary orientation-btn" type="button">
          <span>Auto-Rotate to Landscape</span>
        </button>
        <button id="btn-dismiss-orientation" class="orientation-dismiss-btn" type="button">
          Continue in portrait view
        </button>
      </div>
    </div>

    <!-- Touch controls for touch & mobile devices -->
    <div id="touch-controls">
      <!-- Left: Steering & Throttle Joystick -->
      <div id="joystick" class="touch-joystick-zone">
        <div class="joystick-base">
          <div class="joystick-knob" id="joystick-knob"></div>
        </div>
      </div>

      <!-- Right: Simple Minimal Laser Weapon Fire Circle -->
      <div id="touch-shoot-zone" class="touch-shoot-zone">
        <button id="btn-touch-shoot" class="touch-shoot-btn" aria-label="Fire Weapons"></button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
