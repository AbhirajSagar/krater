<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StarSparrow: Multiplayer Spaceship Battle</title>
    <meta name="description" content="High-octane 3D multiplayer spaceship dogfight simulator powered by Three.js and Render backend." />
    <!-- Google Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="app"></canvas>

    <!-- Minimal Glassmorphic Loading Screen Overlay -->
    <div id="loading-screen" class="loading-screen">
      <div class="glass-card">
        <div class="loading-text" id="loading-text">Loading...</div>
        <div class="glass-bar-track">
          <div class="glass-bar-fill" id="loading-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Sci-Fi Minimal Rhombus Crosshair -->
    <div id="crosshair-container" class="crosshair-container" aria-hidden="true">
      <svg class="crosshair-rhombus" viewBox="0 0 36 36" fill="none">
        <polygon class="rhombus-outline" points="18,4 32,18 18,32 4,18" />
        <circle class="rhombus-dot" cx="18" cy="18" r="1.5" />
        <line class="rhombus-tick" x1="18" y1="1" x2="18" y2="3" />
        <line class="rhombus-tick" x1="18" y1="33" x2="18" y2="35" />
        <line class="rhombus-tick" x1="1" y1="18" x2="3" y2="18" />
        <line class="rhombus-tick" x1="33" y1="18" x2="35" y2="18" />
      </svg>
    </div>

    <!-- Minimal Weapon Ammo Telemetry -->
    <div id="minimal-ammo-hud" class="minimal-ammo-hud" aria-label="Weapon Ammunition">
      <div class="ammo-icon-wrap">
        <svg class="ammo-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 4c0-1.1.9-2 2-2s2 .9 2 2v8H4V4zm0 10h4v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-7zm6-10c0-1.1.9-2 2-2s2 .9 2 2v8h-4V4zm0 10h4v7a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-7zm6-10c0-1.1.9-2 2-2s2 .9 2 2v8h-4V4zm0 10h4v7a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-7z"/>
        </svg>
      </div>
      <div class="ammo-content">
        <div class="ammo-digits-wrap">
          <span class="ammo-current" id="ammo-current-val">60</span>
          <span class="ammo-divider">/</span>
          <span class="ammo-total" id="ammo-total-val">60</span>
        </div>
        <div class="ammo-bar-track">
          <div class="ammo-bar-fill" id="ammo-bar-fill" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- Forced Landscape Orientation Guard for Smaller Mobile Touch Devices -->
    <div id="orientation-guard" class="orientation-guard hidden" aria-hidden="true">
      <div class="orientation-guard-card">
        <div class="orientation-guard-icon-wrap">
          <svg class="phone-rotate-svg" viewBox="0 0 48 48" fill="none">
            <rect class="phone-rect" x="14" y="6" width="20" height="36" rx="4" stroke="currentColor" stroke-width="2" />
            <line class="phone-speaker" x1="21" y1="10" x2="27" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle class="phone-btn" cx="24" cy="37" r="1.5" fill="currentColor" />
            <path class="rotate-arrow" d="M38 18 C 42 22, 42 28, 38 32" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
            <polygon class="rotate-head" points="36,30 40,36 34,36" fill="#00f0ff" />
          </svg>
        </div>
        <div class="orientation-guard-title">ROTATE DEVICE</div>
        <div class="orientation-guard-subtitle">LANDSCAPE MODE REQUIRED</div>
        <p class="orientation-guard-desc">
          StarSparrow requires landscape aspect-ratio for hangar telemetry and tactical dogfights.
        </p>
        <button id="btn-force-landscape" class="btn-primary orientation-btn" type="button">
          <span>Auto-Rotate to Landscape</span>
        </button>
        <button id="btn-dismiss-orientation" class="orientation-dismiss-btn" type="button">
          Continue in portrait view
        </button>
      </div>
    </div>

    <!-- Touch controls for touch & mobile devices -->
    <div id="touch-controls">
      <!-- Left: Steering & Throttle Joystick -->
      <div id="joystick" class="touch-joystick-zone">
        <div class="joystick-base">
          <div class="joystick-knob" id="joystick-knob"></div>
        </div>
      </div>

      <!-- Right: Simple Minimal Laser Weapon Fire Circle -->
      <div id="touch-shoot-zone" class="touch-shoot-zone">
        <button id="btn-touch-shoot" class="touch-shoot-btn" aria-label="Fire Weapons"></button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
